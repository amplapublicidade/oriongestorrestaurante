version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orion-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      # Monta o código-fonte para live-reloading (opcional, para desenvolvimento)
      - ./backend/src:/app/src
      # Monta o arquivo de credenciais para dentro do container (essencial)
      - ./backend/src/config/firebase-credentials.json:/app/config/firebase-credentials.json:ro
    depends_on:
      - redis
    networks:
      - orion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passa a variável de ambiente para o build do React
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: orion-frontend
    restart: unless-stopped
    ports:
      - "8000:80" # Expõe a porta 80 do container (Nginx) na porta 8000 da sua máquina
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:

networks:
  orion-network:
    driver: bridge